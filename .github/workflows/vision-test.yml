name: Vision gate tests
on:
  workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get install -y -qq ffmpeg
          pip install -q pillow
      - name: Test A - Mandy strip club clip must be rejected
        run: |
          curl -sL --fail -o mandy.mp4 "https://github.com/pranavkumar4645-web/gta6-clip-factory/releases/download/clip-AntsyPolishedKoupreyBibleThump-NHTlUqUqyb4BUNY3/out.mp4"
          python3 vision_check.py --dump-stats statsA.json mandy.mp4 || true
          python3 vision_check.py mandy.mp4 && echo "TEST_A_FAILED_TO_REJECT" || echo "TEST_A_REJECTED_AS_EXPECTED"
      - name: Test B - Clix clip must pass
        run: |
          curl -sL --fail -o clix.mp4 "https://github.com/pranavkumar4645-web/gta6-clip-factory/releases/download/clip-UnusualMoistSharkBIRB-Wlz2wmgaTOQAniKu/out.mp4"
          python3 vision_check.py --dump-stats statsB.json clix.mp4 || true
          python3 vision_check.py clix.mp4 && echo "TEST_B_PASSED_AS_EXPECTED" || echo "TEST_B_WRONGLY_REJECTED"
      - name: Gate margin report
        run: |
          python3 - <<'EOF'
          import json
          a = json.load(open('statsA.json'))
          b = json.load(open('statsB.json'))
          for tag, st in (('A(Mandy, must reject)', a), ('B(Clix, must pass)', b)):
              fs = st['feat']
              trips = [f for f in fs if f['trip']]
              run = mx = 0
              for f in fs:
                  run = run + 1 if f['trip'] else 0
                  mx = max(mx, run)
              print('%s: frames=%d trip_frames=%d (%.0f%%) max_consecutive=%d'
                    % (tag, len(fs), len(trips), 100.0 * len(trips) / len(fs), mx))
          EOF
      - name: Test C - scout scoring on live top 100
        env:
          TWITCH_CLIENT_ID: dyys9anz9uaayb45wnld000ne5l7bm
          TWITCH_SECRET: yr0m6ju2yu597ep4lxp3w4jx4bvly7
        run: |
          TOKEN=$(curl -s -X POST "https://id.twitch.tv/oauth2/token?client_id=${TWITCH_CLIENT_ID}&client_secret=${TWITCH_SECRET}&grant_type=client_credentials" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -s -H "Client-Id: ${TWITCH_CLIENT_ID}" -H "Authorization: Bearer ${TOKEN}" "https://api.twitch.tv/helix/clips?game_id=1867279146&first=100" > clips.json
          python3 - <<'EOF'
          import json, re
          from datetime import datetime, timezone
          BL = re.compile(r'nude|naked|nsfw|porn|sex|sexy|sexual|18\+|xxx|erotic|orgy|threesom|blowjob|handjob|boob|tits?|titties|ass|butt|ass cheeks|onlyfans|horny|strip|stripper|pole danc|lap danc|lapdance|pole|mandy|lulu|brothel|prostitut|escort|kinky|fetish|bdsm|lingerie|panties|thong|topless|topless|shower scene|uncensor|hot scene|leaked scene|scene leak|gore|behead|decapitat|mutilat|disembowel|suicide|kill myself|self harm|school shooting|shooting up|terrorist|bomb making|slur|n-word|fag|retard|gyatt|gyat|thicc|baddie|bbl|backshots|twerk|twerking|milf|dilf|zaddy|cougar|cakez|big cake', re.I)
          WL = re.compile(r'funny|hilarious|comedy|joke|lmao|lmfao|funniest|wtf|omg|insane|crazy|wild|chaos|chaotic|glitch|bug|failing|fails?|fail|clip of the year|clutch|npc|physics|ai did|random|rng|moment|gone wrong|prank|troll|rage|screaming|panics?|freak(ed|s)? out|react(ion|s)?|chase|police|cop|wanted|busted|5 ?star|car crash|accident|stunt|jump|trick shot|speedrun|hidden|secret|discovered|found|easter egg|lore|theory|wow|no way|did (he|she|bro)|bro died|he died|she died|dies|first time|day ?\d|chapter ?\d|boss ?fight|npc war|gang war|shootout|mission (went|failed)|robbery|heist|snitch', re.I)
          clips = json.load(open('clips.json')).get('data', [])
          cands = []
          for c in clips:
              if BL.search(c.get('title') or '') or BL.search(c.get('broadcaster_name') or ''):
                  continue
              if not WL.search(c.get('title') or ''):
                  continue
              d = c.get('duration') or 0
              if d < 15 or d > 180:
                  continue
              cands.append(c)
          now = datetime.now(timezone.utc)
          BOOSTS = [(2000, re.compile(r'funniest|funny|clip of the year', re.I)), (1000, re.compile(r'wtf|omg|insane|crazy|chaos', re.I)), (800, re.compile(r'gone wrong|fails', re.I)), (500, re.compile(r'glitch|bug|npc|physics|hidden|secret', re.I)), (300, re.compile(r'clutch|chase|police|5 ?star|heist', re.I))]
          for c in cands:
              try:
                  ct = datetime.strptime(c.get('created_at') or '', '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)
                  hours = max(0.5, (now - ct).total_seconds() / 3600.0)
              except Exception:
                  hours = 24.0
              score = min(c.get('view_count', 0) / hours, 5000.0)
              for pts, rx in BOOSTS:
                  if rx.search(c.get('title') or ''):
                      score += pts
              if hours < 24:
                  score += (24 - hours) * 50
              c['score'] = int(score)
          cands.sort(key=lambda c: -c['score'])
          print('clips fetched:', len(clips), '| passing gates:', len(cands))
          print('TOP 5 BY VIRAL SCORE:')
          for c in cands[:5]:
              print('  %s | score %d | views %d | %s | @%s' % (c['id'], c['score'], c.get('view_count', 0), c.get('title'), c['broadcaster_name']))
          if cands:
              print('WOULD PICK:', cands[0]['id'], '|', cands[0].get('title'), '| score', cands[0]['score'])
          EOF
