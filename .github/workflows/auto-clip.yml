name: Auto clip (scout + render + webhook)
on:
  schedule:
    - cron: "17 5,8,11,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  auto-clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWITCH_CLIENT_ID: dyys9anz9uaayb45wnld000ne5l7bm
      TWITCH_SECRET: yr0m6ju2yu597ep4lxp3w4jx4bvly7
      WEBHOOK_URL: https://cloud.activepieces.com/api/v1/webhooks/GKLser6YYAfdi6dtczbOs
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: pranavkumar4645-web/gta6-clip-factory
    steps:
      - name: Scout Twitch clips
        run: |
          set -uo pipefail
          TOKEN=$(curl -s -X POST "https://id.twitch.tv/oauth2/token?client_id=${TWITCH_CLIENT_ID}&client_secret=${TWITCH_SECRET}&grant_type=client_credentials" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -s -H "Client-Id: ${TWITCH_CLIENT_ID}" -H "Authorization: Bearer ${TOKEN}" "https://api.twitch.tv/helix/clips?game_id=1867279146&first=30" > clips.json
          gh release list --limit 200 --json tagName > tags.json 2>/dev/null || echo '[]' > tags.json
          python3 - <<'EOF'
          import json, re, sys, os
          clips = json.load(open('clips.json')).get('data', [])
          done = {t.get('tagName','') for t in json.load(open('tags.json'))}
          BL = re.compile('nude|naked|nsfw|porn|sex|sexy|sexual|strip|onlyfans|horny|erotic|gore|beheading|decapitat', re.I)
          EMOJI = re.compile('[' + chr(0x1F000) + '-' + chr(0x1FAFF) + chr(0x2600) + '-' + chr(0x27BF) + chr(0x1F1E6) + '-' + chr(0x1F1FF) + chr(0x2190) + '-' + chr(0x21FF) + chr(0x2B00) + '-' + chr(0x2BFF) + chr(0xFE0F) + chr(0x200D) + ']')
          cands = []
          for c in clips:
              cid = c['id'].rstrip('-')
              if 'clip-' + cid in done:
                  continue
              if BL.search(c.get('title') or '') or BL.search(c.get('broadcaster_name') or ''):
                  continue
              d = c.get('duration') or 0
              if d < 15 or d > 180:
                  continue
          title = re.sub(r'#\w+', '', c.get('title') or '')
          title = EMOJI.sub('', title)
          title = BL.sub('', title)
          title = re.sub(r'\s+', ' ', title).strip().strip('|:-\u2013\u2014 ');
          title = title[:60].strip() or 'GTA 6 funny moment'
          cands.append({'id': cid, 'title': title, 'credit': '@' + c['broadcaster_name'], 'views': c.get('view_count', 0)})
          cands.sort(key=lambda x: -x['views'])
          top = cands[:5]
          if not top:
              print('::error::no suitable clip')
              sys.exit(1)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CANDIDATES<<__EOF__' + chr(10))
              env.write(json.dumps(top) + chr(10))
              env.write('__EOF__' + chr(10))
          for c in top:
              print('Candidate:', c['id'], '|', c['title'], '|', c['credit'], '| views', c['views'])
          EOF
      - uses: actions/checkout@v4
        if: env.CANDIDATES != ''
      - uses: actions/setup-python@v5
        if: env.CANDIDATES != ''
        with:
          python-version: '3.11'
      - name: Install tools
        if: env.CANDIDATES != ''
        run: |
          which ffmpeg || sudo apt-get install -y -qq ffmpeg
          sudo apt-get install -y -qq fonts-liberation
          pip install -q faster-whisper yt-dlp
      - name: Render
        if: env.CANDIDATES != ''
        run: |
          python3 - <<'EOF'
          import json, os, shlex, subprocess, sys
          cands = json.loads(os.environ['CANDIDATES'])
          for c in cands:
              if os.path.exists('source.mp4'):
                  os.remove('source.mp4')
              r = subprocess.run(['yt-dlp','-o','source.mp4','https://clips.twitch.tv/' + c['id']])
              if r.returncode == 0 and os.path.exists('source.mp4') and os.path.getsize('source.mp4') > 0:
                  lines = ['CLIP_ID=' + c['id'], 'TITLE=' + c['title'], 'CREDIT=' + c['credit']]
                  with open('chosen.env','w') as f:
                      f.write(chr(10).join(['CLIP_ID=' + shlex.quote(c['id']), 'TITLE=' + shlex.quote(c['title']), 'CREDIT=' + shlex.quote(c['credit'])]))
                  with open(os.environ['GITHUB_ENV'],'a') as f:
                      for l in lines:
                          f.write(l + chr(10))
                  print('Chosen clip', c['id'], '|', c['title'], '|', c['credit'])
                  sys.exit(0)
          print('::error::no downloadable clip')
          sys.exit(1)
          EOF
          source chosen.env
          export CLIP_URL="https://clips.twitch.tv/${CLIP_ID}"
          bash render.sh
      - name: Publish release
        id: release
        if: env.CLIP_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "clip-${CLIP_ID}" out.mp4 frame.jpg --title "clip-${CLIP_ID}" --notes "TITLE: ${TITLE} | CREDIT: ${CREDIT}" --target main
      - name: Notify webhook
        if: env.CLIP_ID != '' && steps.release.outcome == 'success'
        run: |
          python3 - <<'EOF' > payload.json
          import json, os
          print(json.dumps({
              "videoUrl": "https://github.com/pranavkumar4645-web/gta6-clip-factory/releases/download/clip-%s/out.mp4" % os.environ["CLIP_ID"],
              "title": os.environ["TITLE"],
              "credit": os.environ["CREDIT"],
              "releaseTag": "clip-%s" % os.environ["CLIP_ID"],
          }))
          EOF
          cat payload.json
          curl -s -X POST "${WEBHOOK_URL}" -H "Content-Type: application/json" --data @payload.json
