---
name: probe
on:
  workflow_dispatch:
    inputs:
      clip_url:
        description: Twitch clip URL
        required: true
      title:
        description: Caption text
        required: false
        default: 'none'
      credit:
        description: Streamer credit
        required: false
        default: 'none'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          which ffmpeg || sudo apt-get install -y -qq ffmpeg
          sudo apt-get install -y -qq fonts-liberation
          pip install -q faster-whisper yt-dlp
      - run: echo hello
